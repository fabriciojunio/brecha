# Plugin do OWASP CRS que barra objeto Java serializado (BRECHA-017).
#
# Carregado como plugin "-before.conf": o activate-plugins.sh da imagem acha
# este arquivo em /opt/owasp-crs/plugins/ e descomenta o include no setup.conf,
# então a regra roda antes do CRS. É virtual patching: não depende das regras
# 944200/944210 do CRS nem do nível de paranoia, que na prova deixaram passar o
# objeto em base64 dentro de JSON.
#
# rO0AB é o base64 dos magic bytes 0xAC 0xED 0x00 0x05 que o ObjectOutputStream
# grava no início de todo objeto serializado. O byte seguinte (versão 0x0005)
# cai em [A-Za-z0-9+/], o que evita casar com a string "rO0AB" solta em texto.
# ID na faixa 9.500.000-9.999.999 reservada para plugins do CRS.
SecRule REQUEST_BODY|ARGS "@rx rO0AB[A-Za-z0-9+/]" \
    "id:9519100,\
    phase:2,\
    deny,\
    status:403,\
    t:none,\
    log,\
    msg:'Objeto Java serializado bloqueado (BRECHA-017)',\
    logdata:'assinatura de serializacao em %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'language-java',\
    tag:'attack-deserialization'"
