# Virtual patching do BRECHA-017 (desserialização Java).
#
# O CRS tem as regras 944200 e 944210 para serialização Java, mas elas
# dependem do parser de corpo popular ARGS, e aqui o objeto chega em base64
# dentro de um JSON; na prova de rede o CRS em paranoia 2 deixou passar. Esta
# regra inspeciona o corpo cru e os argumentos e barra na origem, sem depender
# da versão do CRS nem do nível de paranoia.
#
# rO0AB é o base64 dos magic bytes 0xAC 0xED 0x00 0x05 que o ObjectOutputStream
# grava no início de todo objeto serializado. O byte seguinte (versão 0x0005)
# cai em [A-Za-z0-9+/], o que evita casar com a string "rO0AB" solta em texto.
SecRule REQUEST_BODY|ARGS "@rx rO0AB[A-Za-z0-9+/]" \
    "id:1000917,\
    phase:2,\
    deny,\
    status:403,\
    t:none,\
    log,\
    msg:'Objeto Java serializado bloqueado (BRECHA-017)',\
    logdata:'assinatura de serializacao em %{MATCHED_VAR_NAME}',\
    severity:'CRITICAL',\
    tag:'language-java',\
    tag:'attack-deserialization'"
