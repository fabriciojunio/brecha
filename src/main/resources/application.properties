spring.application.name=brecha
# Só na máquina local. O laboratório não deve ser exposto em rede nenhuma.
server.address=127.0.0.1
server.port=8080

# Segredo do token do /v2. Fora do laboratório viria de variável de ambiente.
brecha.segredo=${BRECHA_SEGREDO:laboratorio-local-segredo-com-mais-de-32-bytes}
# Emissores de comprovante aceitos pelo /v2 (BRECHA-007).
brecha.comprovantes.hosts=comprovantes.exemplo.com.br
# A API legada fica ligada para o BRECHA-009 existir no laboratório.
brecha.legado.ativo=true
